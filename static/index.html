<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Turnwise</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --label:#000; --secondary:rgba(60,60,67,.6); --tertiary:rgba(60,60,67,.3);
  --separator:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12); --tint:#007aff; --red:#ff3b30; --green:#34c759; --orange:#ff9500; --dim:rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --card:#1c1c1e; --label:#fff; --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3);
  --separator:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --tint:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --dim:rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:720px;margin:0 auto;padding:12px 16px 120px}
:root{--display:"Baloo 2",-apple-system,system-ui,sans-serif}
h1{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:0;margin:20px 0 12px;line-height:1.15}
h2{font-size:13px;font-weight:400;color:var(--secondary);text-transform:uppercase;letter-spacing:-.08px;margin:24px 16px 8px}
h3{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 6px}
a{color:var(--tint)}
button{font:inherit;color:var(--tint);background:none;border:0;padding:0;min-height:44px;min-width:44px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{opacity:.4}
a.btn,a.back{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 20px;border-radius:12px;font-weight:600;font-size:17px;background:var(--fill)}
.btn.prominent{background:var(--tint);color:#fff}
.btn.destructive{color:var(--red)}
.btn.record{background:var(--red);color:#fff;border-radius:999px;padding:0 24px}
.btn[disabled]{opacity:.4}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.nav .back{display:inline-flex;align-items:center;gap:2px;font-size:17px;margin-left:-8px;min-height:44px;padding:0 8px}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;text-decoration:none;color:inherit;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--separator)}
.row .main{flex:1;min-width:0}
.row .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:15px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--tertiary);flex:none}
.row input[type=number],.row select{font:inherit;color:var(--label);background:none;border:0;text-align:right;flex:1;min-width:0;max-width:60%;outline:none}
.row select{text-align-last:right}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 10px;height:36px;margin-bottom:12px;color:var(--secondary)}
.search input{flex:1;font:inherit;font-size:17px;background:none;border:0;outline:none;color:var(--label);min-width:0}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--secondary);white-space:nowrap}
.pill.busy{color:var(--orange)}.pill.error{color:var(--red)}
.banner{background:var(--card);border-left:4px solid var(--orange);border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:12px;color:var(--secondary)}
.banner.err{border-color:var(--red)}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:16px}
.card ul{margin:0;padding-left:20px}.card li{margin:4px 0}
.card p{margin:0 0 8px}.card p:last-child{margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--separator)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:12px 0}
.seg button{flex:1;min-height:32px;border-radius:7px;font-size:13px;font-weight:500;color:var(--label)}
.seg button.on{background:var(--tint);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.turn{padding:10px 16px;cursor:pointer}
.turn+.turn{border-top:.5px solid var(--separator)}
.turn.playing{background:var(--fill)}
.turn .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--secondary);margin-bottom:2px}
.turn .who b{color:var(--tint);font-weight:600;min-height:auto;min-width:auto}
/* every voice gets its own colour: --h is a hue derived from the speaker's name, the same in every note, source and player */
.voice{color:hsl(var(--h) 62% 38%);font-family:var(--display);font-weight:600}
.chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex:none;background:hsl(var(--h) 85% 88%);color:hsl(var(--h) 62% 34%);font:600 12px/1 var(--display);vertical-align:middle;margin-right:6px}
@media (prefers-color-scheme: dark){.voice{color:hsl(var(--h) 85% 72%)}.chip{background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 85% 76%)}}
.turn .who b.voice{color:hsl(var(--h) 62% 38%)}@media (prefers-color-scheme: dark){.turn .who b.voice{color:hsl(var(--h) 85% 72%)}}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle;margin:0 2px}
.bars i{width:3px;background:currentColor;border-radius:2px;animation:bar 1s ease-in-out infinite;height:40%}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
@keyframes bar{0%,100%{height:30%}50%{height:100%}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.new{animation:rise .3s ease-out}
/* the duo: two voices taking turns, which is what the app is about */
.duo{display:block;width:168px;height:60px;margin:6px 0 -6px -4px;overflow:visible}
.duo .m1{fill:var(--tint)}.duo .m2{fill:hsl(28 92% 58%)}.duo .ink{fill:#1c1c1e}.duo .white{fill:#fff}
.duo .bub rect{fill:var(--card);stroke:var(--separator);stroke-width:1}.duo .bub path{fill:var(--card)}.duo .bub circle{fill:var(--secondary)}
.duo .b1{transform-origin:46px 30px;animation:say 5s ease-in-out infinite both}.duo .b2{transform-origin:120px 30px;animation:say 5s ease-in-out infinite 2.5s both}
.duo .b1 circle{animation:dot 1s ease-in-out infinite}.duo .b2 circle{animation:dot 1s ease-in-out infinite 2.5s}
.duo .b1 circle:nth-child(5){animation-delay:.15s}.duo .b1 circle:nth-child(6){animation-delay:.3s}.duo .b2 circle:nth-child(5){animation-delay:2.65s}.duo .b2 circle:nth-child(6){animation-delay:2.8s}
.duo .g1{transform-origin:30px 54px;animation:bob 5s ease-in-out infinite}.duo .g2{transform-origin:132px 54px;animation:bob 5s ease-in-out infinite 2.5s}
.duo .eye{transform-origin:center;transform-box:fill-box;animation:blink 4.6s infinite}.duo .g2 .eye{animation-delay:1.7s}
@keyframes say{0%,6%{transform:scale(0);opacity:0}10%,44%{transform:scale(1);opacity:1}48%,100%{transform:scale(0);opacity:0}}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bob{0%,6%,48%,100%{transform:none}14%,26%,38%{transform:translateY(-2px) rotate(-3deg)}20%,32%,44%{transform:translateY(0) rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.turn .en{color:var(--secondary);font-size:15px;margin-top:4px}
.meta{color:var(--secondary);font-size:15px;margin:0 0 12px}
audio{width:100%;margin:8px 0 4px}
.sheet{background:var(--card);border-radius:16px;padding:20px 16px;text-align:center}
.timer{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;margin:12px 0}
.level{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin:0 0 20px}
.level i{display:block;height:100%;background:var(--green);width:0;transition:width .1s}
.titleinput{font:inherit;font-size:20px;font-weight:600;background:none;border:0;border-bottom:1px solid var(--separator);width:100%;color:var(--label);outline:none;padding:8px 0;text-align:center}
.empty{text-align:center;color:var(--secondary);padding:48px 16px}
[data-theme="pink"]{--bg:#fbeef3;--card:#fff;--tint:#ff2d55;--fill:rgba(255,45,85,.1);--separator:rgba(120,60,80,.25)}
@media (prefers-color-scheme: dark){[data-theme="pink"]{--bg:#140a0f;--card:#261620;--tint:#ff375f;--fill:rgba(255,55,95,.2);--separator:rgba(140,90,110,.5)}}
progress{width:100%;height:6px;accent-color:var(--tint)}
.toggle{appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;cursor:pointer;margin:0}
.toggle:checked{background:var(--green)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.toggle:checked::after{left:22px}
/* chat */
.msg{margin:10px 0}
.msg.user{margin-left:auto;width:fit-content;max-width:85%;background:var(--tint);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;white-space:pre-wrap}
.msg.bot{background:var(--card);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:16px}
.msg.bot p{margin:0 0 8px}.msg.bot ul{margin:0 0 8px;padding-left:20px}.msg.bot li{margin:4px 0}
.msg.bot .meta{font-size:12px;color:var(--secondary);margin-top:6px}
.cite{font-size:12px;font-weight:600;color:var(--tint);text-decoration:none;padding:0 4px;border-radius:4px;background:var(--fill);min-height:0}
.src{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:.5px solid var(--separator);margin:0 -4px;padding-left:4px;padding-right:4px;border-radius:8px}
.src .play{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:50%;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px;margin-top:2px}
.src .body{flex:1;min-width:0}
.src .meta{font-size:12px;color:var(--secondary);display:flex;align-items:center;flex-wrap:wrap;gap:0 4px}.src .meta b{color:var(--tint)}.src .meta a{color:var(--secondary)}
.src.playing .play{background:var(--fill);color:var(--tint)}
.src .txt{font-size:15px;margin-top:2px}.src .en{font-size:13px;color:var(--secondary);margin-top:2px}
.src.playing,.src.flash{background:var(--fill)}
.askbar input{flex:1;font:inherit;font-size:17px;background:var(--card);border:.5px solid var(--separator);border-radius:22px;padding:10px 16px;color:var(--label);outline:none;min-width:0;min-height:44px;box-sizing:border-box}
.askbar input:disabled{opacity:.5}
.askbar .btn{padding:0 16px;border-radius:22px}
#player{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:696px;margin:0 auto;background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:5}
#player[hidden]{display:none}
#player .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:rgba(235,235,245,.6)}#player .ptop b{color:var(--tint)}#player .voice{color:hsl(var(--h) 85% 72%)}#player .chip{background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 85% 76%)}
#player .ptitle{color:rgba(235,235,245,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#player .sub{font-size:15px;margin:6px 0 2px;line-height:1.3}#player .suben{font-size:12px;color:rgba(235,235,245,.6)}
#player .pctl{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:12px}
#player .pctl button{color:#fff;min-width:36px;min-height:36px;font-size:13px}#player .pctl input{flex:1;min-width:0;accent-color:var(--tint)}
/* dialogs: iOS-style alert and action sheet */
dialog{border:0;padding:0;background:transparent;color:var(--label);max-width:none;max-height:none}
dialog::backdrop{background:var(--dim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.alert{width:270px;background:var(--card);border-radius:14px;overflow:hidden;text-align:center;font-size:13px}
.alert .body{padding:19px 16px 16px}
.alert h3{font-size:17px;margin:0 0 4px}
.alert p{margin:0;color:var(--secondary)}
.alert input{width:100%;margin-top:12px;font:inherit;font-size:15px;padding:8px 10px;border:.5px solid var(--separator);border-radius:8px;background:var(--bg);color:var(--label);outline:none}
.alert .btns{display:flex;border-top:.5px solid var(--separator)}
.alert .btns button{flex:1;font-size:17px;min-height:44px;border-left:.5px solid var(--separator)}
.alert .btns button:first-child{border-left:0}
.alert .btns.col{flex-direction:column}.alert .btns.col button{border-left:0;border-top:.5px solid var(--separator)}.alert .btns.col button:first-child{border-top:0}
.alert .btns button.destructive{color:var(--red)}.alert .btns button.bold{font-weight:600}
.asheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.asheet .group{margin-bottom:8px}
.asheet button{width:100%;font-size:20px;min-height:57px;background:var(--card);border-top:.5px solid var(--separator)}
.asheet .group button:first-child{border-top:0}
.asheet button.destructive{color:var(--red)}.asheet button.cancel{font-weight:600;border-radius:12px}
.asheet .head{font-size:13px;color:var(--secondary);text-align:center;padding:12px 16px;background:var(--card)}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card);color:var(--label);padding:10px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:15px;z-index:9;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.bars i{height:70%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||''}catch(e){}</script>
<main id="app"></main>
<div id="player" hidden role="region" aria-label="Player">
  <div class="ptop"><span id="pwho"></span><a id="ptitle" class="ptitle" href="#"></a></div>
  <div class="sub" id="psub"></div><div class="suben" id="psuben"></div>
  <div class="pctl"><button data-step="-1" aria-label="Previous turn">◀◀</button><button id="pplay" aria-label="Play or pause">❚❚</button><button data-step="1" aria-label="Next turn">▶▶</button>
    <input type="range" id="prange" min="0" max="100" step="0.1" value="0" aria-label="Position"><span id="ptime">0:00</span><button id="pclose" aria-label="Close player">✕</button></div>
  <audio id="paudio" preload="metadata"></audio>
</div>
<input type="file" id="file" multiple accept="audio/*,video/*,.m4a,.mp3,.wav,.ogg,.opus,.webm,.mp4" class="sr" aria-hidden="true">
<dialog id="dlg"></dialog>
<script>
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ts = s => { s = Math.floor(s||0); return (s>=3600 ? Math.floor(s/3600)+':' : '') + String(Math.floor(s%3600/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const dur = s => s==null ? '' : (s>=3600 ? Math.round(s/60)+' min' : Math.max(1,Math.round(s/60))+' min');
const fmtDate = iso => iso ? new Date(iso).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const dayLabel = iso => { const d = new Date(iso), t = new Date(); const diff = Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 864e5);
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString([], {weekday:'short', day:'numeric', month:'short', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric'}); };
class StaleError extends Error {}  // the user moved to another screen while this request was in flight
let renderSeq = 0;
const api = async (path, opt={}) => {  // 20 s cap: a stalled tunnel becomes the retry banner, never a hang
  const c = new AbortController(), t = setTimeout(() => c.abort(), 20000), seq = renderSeq;
  try { const r = await fetch('/api'+path, {...opt, signal: c.signal}); if (seq !== renderSeq) throw new StaleError('stale'); if (!r.ok) throw new Error(await r.text()); return r.json(); } finally { clearTimeout(t); } };
const json = (method, body) => ({method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
const spkName = (note, k) => note.speakers?.[k] || (k.startsWith('SPEAKER_') ? 'Speaker ' + (parseInt(k.split('_').pop()) + 1) : k);
const PALETTE = [212, 340, 152, 28, 268, 184, 48, 4, 112, 300];  // ten hues far enough apart to tell at a glance
const hue = name => {  // known voices take palette slots in the order they were named; unnamed "Speaker N" sit between them; anything else is hashed
  name = String(name); const i = state.palette?.indexOf(name) ?? -1;
  if (i >= 0) return (PALETTE[i % 10] + Math.floor(i / 10) * 12) % 360;
  const m = /^Speaker (\d+)$/.exec(name); if (m) return (PALETTE[(m[1] - 1) % 10] + 18) % 360;
  let h = 2166136261; for (const c of name) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h % 360; };
const voice = name => `<b class="voice" style="--h:${hue(name)}">${esc(name)}</b>`;
const chip = name => `<span class="chip" style="--h:${hue(name)}" aria-hidden="true">${esc(String(name).replace(/^Speaker /, '').slice(0, 1).toUpperCase())}</span>`;
const bars = '<span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
const DUO = `<svg class="duo" viewBox="0 0 168 60" aria-hidden="true">
  <g class="g1"><path class="m1" d="M12 54c-2-14 4-26 18-26s20 12 18 26z"/><path class="m1" d="M22 30l3-10 5 9z"/><path class="m1" d="M34 29l5-9 3 10z"/>
    <circle class="white" cx="24" cy="40" r="4"/><circle class="white" cx="36" cy="40" r="4"/><circle class="ink eye" cx="25" cy="40.5" r="1.8"/><circle class="ink eye" cx="37" cy="40.5" r="1.8"/>
    <path d="M25 48q5 4 10 0" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/></g>
  <g class="bub b1"><rect x="46" y="18" width="36" height="20" rx="10"/><path d="M52 36l-5 8 11-5z"/><circle cx="56" cy="28" r="2.2"/><circle cx="64" cy="28" r="2.2"/><circle cx="72" cy="28" r="2.2"/></g>
  <g class="g2"><rect class="m2" x="114" y="20" width="36" height="34" rx="15"/><circle class="m2" cx="132" cy="14" r="4"/><rect class="m2" x="131" y="14" width="2" height="8"/>
    <circle class="white" cx="132" cy="36" r="7.5"/><circle class="ink eye" cx="133" cy="36" r="3"/>
    <path d="M124 46q8 6 16 0" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/></g>
  <g class="bub b2"><rect x="84" y="16" width="36" height="20" rx="10"/><path d="M114 34l5 8-11-5z"/><circle cx="94" cy="26" r="2.2"/><circle cx="102" cy="26" r="2.2"/><circle cx="110" cy="26" r="2.2"/></g>
</svg>`;
const STATES = {uploading:'Uploading', queued:'Queued', recording:'Recording', convert:'Converting', denoise:'Removing noise', diarize:'Finding speakers', transcribe:'Transcribing', translate:'Hinglish + English', summarize:'Summary + title', done:'', error:'Failed'};
const STEPS = ['denoise', 'diarize', 'transcribe', 'translate', 'summarize'];
const elapsed = s => { s = Math.floor(s); return s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's'; };
const progress = st => {
  const cur = st.state === 'convert' ? 0 : STEPS.indexOf(st.state);
  if (cur < 0) return `<div class="banner">${STATES[st.state] || st.state}…</div>`;

const dlg = $('#dlg');
function modal(html, wire) {
  return new Promise(res => {
    dlg.innerHTML = html; dlg.className = '';
    const done = v => { dlg.close(); dlg.innerHTML = ''; res(v); };
    dlg.oncancel = e => { e.preventDefault(); done(null); };
    dlg.onclick = e => { if (e.target === dlg) done(null); };
    wire(done);
    dlg.showModal();
    const inp = $('input', dlg); if (inp) { inp.focus(); inp.select(); }
  });
}
const ui = {
  alert: (title, msg='') => modal(`<div class="alert"><div class="body"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}</div><div class="btns"><button class="bold" data-v="1">OK</button></div></div>`,

  confirm: (title, msg='', okLabel='OK', destructive=false) => modal(`<div class="alert"><div class="body"><h3>${esc(title)}</h3>${msg ? `<p>${esc(msg)}</p>` : ''}</div><div class="btns"><button data-v="0">Cancel</button><button class="${destructive ? 'destructive' : ''} bold" data-v="1">${esc(okLabel)}</button></div></div>`,

    done => { const i = $('input', dlg); i.onkeydown = e => { if (e.key === 'Enter') done(i.value); }; dlg.querySelectorAll('[data-v]').forEach(b => b.onclick = () => done(b.dataset.v === '1' ? i.value : null)); }),
  sheet: (title, actions) => modal(`<div class="asheet"><div class="group">${title ? `<div class="head">${esc(title)}</div>` : ''}${actions.map((a, i) => `<button class="${a.destructive ? 'destructive' : ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div><div class="group"><button class="cancel" data-i="-1">Cancel</button></div></div>`,
    done => dlg.querySelectorAll('[data-i]').forEach(b => b.onclick = () => done(b.dataset.i < 0 ? null : actions[b.dataset.i].value ?? actions[b.dataset.i].label))),
  toast: (msg, ms=2500) => { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); },
};

$('#file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  const label = files.length === 1 ? files[0].name : files.length + ' files';
  const choice = await ui.sheet(`Upload ${label}`, [{label: 'Upload', value: '\0none'}, {label: 'Upload into a folder…', value: '\0pick'}]);
  if (choice === null) return;
  const into = choice === '\0pick' ? await pickFolder() : '';
  if (into === null) return;
  app.innerHTML = `<div class="nav">${back('/', 'Notes')}</div><div class="sheet"><div class="meta">Uploading ${esc(label)}${into ? ' into ' + esc(into) : ''}</div>
    ${files.map((f, i) => `<div style="text-align:left;margin:10px 0"><div class="sub" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div><progress id="p${i}" max="100" value="0"></progress><div class="meta" id="t${i}" style="margin:2px 0 0">Waiting</div></div>`).join('')}
    <div class="meta">Titles, summaries and action items are generated from the content.</div></div>`;
  const upload = (f, i) => new Promise(res => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', `/api/upload?filename=${encodeURIComponent(f.name)}&folder=${encodeURIComponent(into || '')}&created=${(f.lastModified || 0) / 1000}`);
    xhr.upload.onprogress = ev => { if (ev.lengthComputable) { $('#p' + i).value = ev.loaded / ev.total * 100; $('#t' + i).textContent = Math.round(ev.loaded / ev.total * 100) + '%'; } };
    xhr.onload = () => { const ok = xhr.status === 200, r = ok ? JSON.parse(xhr.response) : null; $('#p' + i).value = 100;
      $('#t' + i).textContent = !ok ? 'Failed: ' + xhr.response.slice(0, 120) : r.duplicate ? 'Already transcribed' : 'Queued'; res(r); };
    xhr.onerror = () => { $('#t' + i).textContent = 'Failed'; res(null); };
    xhr.send(f);
  });
  const results = [];
  for (let i = 0; i < files.length; i++) results.push(await upload(files[i], i));  // one at a time: big files, one disk
  const ok = results.filter(Boolean);
  if (files.length === 1 && ok.length) { if (ok[0].duplicate) ui.toast('Already transcribed — opening it'); location.hash = '#/note/' + ok[0].id; return; }
  ui.toast(`${ok.filter(r => !r.duplicate).length} queued${ok.some(r => r.duplicate) ? ', ' + ok.filter(r => r.duplicate).length + ' already done' : ''}${ok.length < files.length ? ', ' + (files.length - ok.length) + ' failed' : ''}`);
  location.hash = '#/';
};

// ---------- record ----------
async function viewRecord() {
  app.innerHTML = `<div class="nav">${back('/', 'Notes')}</div>
    <div class="sheet"><input class="titleinput" id="title" placeholder="Title (optional, generated from content)" aria-label="Meeting title">
    <div class="timer" id="timer" aria-live="off">00:00</div><div class="level" aria-hidden="true"><i id="lvl"></i></div>
    <div class="meta" id="hint">Keep this screen open while recording. Audio is saved to the server every 5 seconds.</div>
    <button class="btn record" id="start">Start recording</button>
    <button class="btn destructive" id="stop" hidden>Stop and transcribe</button></div>`;
  let rec, id, t0, chain = Promise.resolve(), ctx, raf, wake, timer;
  $('#start').onclick = async () => {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: true}}); }
    catch (e) { $('#hint').textContent = 'Microphone access denied or unavailable (needs HTTPS): ' + e.message; return; }
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    ({id} = await api(`/record/start?title=${encodeURIComponent($('#title').value.trim())}&mime=${encodeURIComponent(mime)}`, {method: 'POST'}));
    rec = new MediaRecorder(stream, mime ? {mimeType: mime} : {});
    rec.ondataavailable = ev => { if (ev.data.size) chain = chain.then(() => fetch(`/api/record/${id}/chunk`, {method: 'POST', body: ev.data}).catch(() => { $('#hint').textContent = 'Upload hiccup, retrying…'; return fetch(`/api/record/${id}/chunk`, {method: 'POST', body: ev.data}); })); };
    rec.start(5000);
    t0 = Date.now(); timer = setInterval(() => $('#timer').textContent = ts((Date.now() - t0) / 1000), 500);
    try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {}
    ctx = new AudioContext(); const an = ctx.createAnalyser(); ctx.createMediaStreamSource(stream).connect(an); const buf = new Uint8Array(an.fftSize);
    const tick = () => { an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); $('#lvl').style.width = Math.min(100, m / 1.28) + '%'; raf = requestAnimationFrame(tick); }; tick();
    $('#start').hidden = true; $('#stop').hidden = false; $('#title').disabled = true; $('#hint').textContent = 'Recording…';
    window.onbeforeunload = () => 'Recording in progress';
  };
  if (route()[1] === 'auto') { history.replaceState(null, '', '#/record'); $('#start').click(); }
  $('#stop').onclick = async () => {
    $('#stop').disabled = true; $('#hint').textContent = 'Finishing…'; window.onbeforeunload = null;
    clearInterval(timer); cancelAnimationFrame(raf); wake?.release();
    await new Promise(res => { rec.onstop = res; rec.stop(); });
    rec.stream.getTracks().forEach(t => t.stop()); ctx.close();
    await chain;
    await api(`/record/${id}/finish`, {method: 'POST'});
    location.hash = '#/note/' + id;
  };
}

  state.me = state.me || await api('/me');
  const busy = s.messages.length && s.messages[s.messages.length - 1].pending;
  const model = state.model?.[sid] || s.model || 'local';
  const src = (x, k, mi) => `<div class="src" data-note="${esc(x.note)}" data-turn="${x.turn}" id="src-${mi}-${k}">
      <button class="play" data-note="${esc(x.note)}" data-t="${x.start}" data-title="${esc(x.title)}" aria-label="Play this moment">▶</button>
      <div class="body"><div class="meta">${chip(x.speaker)}${voice(x.speaker)} · <a href="#/note/${esc(x.note)}?t=${x.start}">${esc(x.title)}</a> · ${esc(fmtDate(x.created))} · ${ts(x.start)}</div>
      <div class="txt">${esc(x.hinglish)}</div>${x.english && x.english !== x.hinglish ? `<div class="en">${esc(x.english)}</div>` : ''}</div></div>`;
  const msg = (m, mi) => m.role === 'user' ? `<div class="msg user">${esc(m.text)}</div>`
    : m.pending ? `<div class="msg bot" aria-live="polite"><span style="color:var(--tint)">${bars}</span> ${m.model === 'claude' ? 'Claude' : 'Local model'} is writing <span class="meta">${esc(m.detail || '')} · ${elapsed(Date.now() / 1000 - m.ts)}</span></div>`
    : m.error ? `<div class="banner err">${esc(m.error)}</div>`
    : `<div class="msg bot${mi === s.messages.length - 1 && state.chatCount?.[sid] != null && state.chatCount[sid] !== s.messages.length ? ' new' : ''}">${cites(md(m.text), mi)}${m.sources?.length ? `<div style="margin-top:8px">${m.sources.map((x, k) => src(x, k + 1, mi)).join('')}</div>` : ''}<div class="meta">${m.model === 'claude' ? 'Claude' : 'Local model'}</div></div>`;
  const draft = $('#askin')?.value || '';  // what the user has typed survives polling, visibilitychange and the cached paint
  app.innerHTML = `<div class="nav">${back('/chats' + (s.note ? '/' + s.note : ''), 'Chats')}<button id="menu" aria-label="More actions" style="font-size:24px;line-height:1">⋯</button></div>
    <h1 style="font-size:22px;margin:4px 0">${esc(s.title)}</h1>
    ${state.me.owner ? `<div class="seg" role="tablist">${[['local','Local'],['claude','Claude']].map(([v,l]) => `<button role="tab" aria-selected="${v===model}" class="${v===model?'on':''}" data-model="${v}">${l}</button>`).join('')}</div>` : ''}
    <div id="msgs">${s.messages.map(msg).join('') || '<div class="empty">Ask anything about ' + (s.note ? 'this recording' : 'your recordings') + '.</div>'}</div>
    <form class="bar askbar" id="askform" onsubmit="return false"><input id="askin" type="text" placeholder="Ask a question" autocomplete="off" aria-label="Question" ${busy ? 'disabled' : ''}><button class="btn prominent" type="submit" ${busy ? 'disabled' : ''}>Send</button></form>`;
  $('#askin').value = draft;
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => {  // flips at once; the choice travels with the next question
    (state.model = state.model || {})[sid] = b.dataset.model;
    app.querySelectorAll('.seg button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); }); });
  $('#askform').onsubmit = async e => { e.preventDefault(); const text = $('#askin').value.trim(); if (!text || busy) return;
    const chosen = state.model?.[sid] || model;
    try { await api(`/chats/${sid}/ask`, json('POST', {text, model: chosen})); } catch (err) { if (!(err instanceof StaleError)) ui.alert('Could not ask', err.message); return; }
    $('#askin').value = '';  // sent: the draft-preservation must not bring it back
    state.scrollBottom = true; render(true); };
  $('#menu').onclick = async () => {
    const c = await ui.sheet(s.title, [{label: 'New chat', value: 'new'}, {label: 'Clear messages', value: 'clear'}, {label: 'Delete chat', value: 'delete', destructive: true}]);
    if (c === 'new') { const n = await api('/chats', json('POST', s.note ? {note: s.note, model} : {model})); location.hash = '#/chat/' + n.id; }
    else if (c === 'clear' && await ui.confirm('Clear this chat?', 'The questions and answers will be removed.', 'Clear', true)) { await api(`/chats/${sid}/clear`, {method: 'POST'}); render(true); }
    else if (c === 'delete' && await ui.confirm('Delete this chat?', '', 'Delete', true)) { await api('/chats/' + sid, {method: 'DELETE'}); location.hash = '#/chats' + (s.note ? '/' + s.note : ''); }
  };
  app.querySelectorAll('.cite').forEach(a => a.onclick = e => { e.preventDefault(); const el = $('#src-' + a.dataset.src); if (!el) return; el.scrollIntoView({block: 'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1000); });
  app.querySelectorAll('.src .play').forEach(b => b.onclick = () => window.player?.open(b.dataset.note, +b.dataset.t, b.dataset.title));
  const count = s.messages.length;
  if (state.scrollBottom || (state.chatCount?.[sid] != null && state.chatCount[sid] !== count)) { state.scrollBottom = false; setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 0); }
  (state.chatCount = state.chatCount || {})[sid] = count;
  if (busy) pollTimer = setTimeout(() => render(true), 2000);
}

// ---------- settings ----------
async function viewSettings() {
  const s = await api('/settings'), sp = await api('/speakers');
  const row = (label, ctl) => `<label class="row"><span class="main">${label}</span>${ctl}</label>`;
  app.innerHTML = `<div class="nav">${back('/', 'Notes')}</div><h1>Settings</h1>
    <h2>Speaker detection</h2><div class="group"><div class="row"><div class="main"><div class="title">${s.diarization === 'ok' ? 'On' : 'Off'}</div><div class="sub" style="white-space:normal">${s.diarization === 'ok' ? 'pyannote community-1 on GPU' : esc(s.diarization) + '. Accept the model terms at huggingface.co/pyannote/speaker-diarization-community-1, put HF_TOKEN=… in ~/.config/audio-notes/env and restart the service.'}</div></div></div></div>
    <h2>Known voices</h2><div class="group">${Object.keys(sp).length ? Object.entries(sp).map(([name, c]) => `<div class="row"><div class="main"><div class="title">${esc(name)}</div><div class="sub">${c} voice sample${c === 1 ? '' : 's'}</div></div><button class="destructive" data-del="${esc(name)}" aria-label="Forget ${esc(name)}">Forget</button></div>`).join('') : '<div class="row"><div class="sub" style="white-space:normal">None yet. Open a note and tap a speaker name to name them.</div></div>'}
    ${row('Match threshold', `<input type="number" step="0.05" min="0.3" max="0.95" name="match_threshold" value="${s.match_threshold}" aria-label="Match threshold">`)}</div>
    <h2>Transcription</h2><div class="group">
    ${row('Remove background noise', `<input type="checkbox" class="toggle" name="denoise" ${s.denoise ? 'checked' : ''}>`)}
    ${row('Noise attenuation (dB)', `<input type="number" step="5" min="5" max="100" name="atten_db" value="${s.atten_db}" aria-label="Noise attenuation in dB">`)}
    ${row('Language', `<select name="language" aria-label="Language"><option value="auto" ${s.language==='auto'?'selected':''}>Auto (Hindi + English)</option><option value="hi" ${s.language==='hi'?'selected':''}>Hindi</option><option value="en" ${s.language==='en'?'selected':''}>English</option></select>`)}
    ${row('Theme', `<select name="theme" aria-label="Theme"><option value="system" ${s.theme!=='pink'?'selected':''}>Classic</option><option value="pink" ${s.theme==='pink'?'selected':''}>Pink</option></select>`)}
    <div class="row"><div class="main"><div class="title">Models</div><div class="sub" style="white-space:normal">ASR: ${esc(s.asr_backend)} · Hinglish/English/summary: ${esc(s.llm)} via Ollama</div></div></div>
    ${s.login ? `<div class="row"><div class="main"><div class="title">Signed in as</div><div class="sub">${esc(s.name || s.login)}${s.owner ? '' : ' · your notes are only visible to you'}</div></div></div>` : ''}</div>`;
  app.querySelectorAll('[name]').forEach(i => i.onchange = () => { api('/settings', json('PUT', {[i.name]: i.type === 'checkbox' ? i.checked : i.type === 'number' ? +i.value : i.value})); if (i.name === 'theme') applyTheme(i.value); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (await ui.confirm(`Forget ${b.dataset.del}'s voice?`, '', 'Forget', true)) { await api('/speakers/' + encodeURIComponent(b.dataset.del), {method: 'DELETE'}); render(); } });
}

const state = {};
let lastRoute = '', retryTimer = null, retryDelay = 2000;
async function render(refresh = false) {
  clearTimeout(pollTimer); clearTimeout(retryTimer);
  if (dlg.open && !refresh) { dlg.close(); dlg.innerHTML = ''; }
  if (dlg.open) { pollTimer = setTimeout(() => render(true), 3000); return; }  // don't repaint under an open dialog
  const sameRoute = location.hash === lastRoute;
  if (!sameRoute) { renderSeq++; state.sought = false; (state.scroll = state.scroll || {})[lastRoute] = window.scrollY; }
  const y = refresh || sameRoute ? window.scrollY : (state.scroll?.[location.hash] ?? 0);  // a route you come back to keeps its scroll
  lastRoute = location.hash;
  const [p, id] = route();
  if (p !== 'chat' && window.player) player.close();
  if (!refresh && !sameRoute) {  // paint at once from what this route showed last time (or a placeholder); the data arrives after
    app.innerHTML = state.html?.[location.hash] || `<div class="nav">${back('/', 'Notes')}</div><div class="empty">Loading…</div>`;
    window.scrollTo(0, y);
  }
  try {
    if (p === 'note') await viewNote(id); else if (p === 'record') await viewRecord(); else if (p === 'settings') await viewSettings();
    else if (p === 'chats') await viewChats(id); else if (p === 'chat') await viewChat(id); else await viewList();
    retryDelay = 2000;
    (state.html = state.html || {})[location.hash] = app.innerHTML;
  } catch (e) {
    if (e instanceof StaleError) return;  // a newer screen owns the page now
    const offline = e instanceof TypeError || e.name === 'AbortError';  // fetch failed or timed out: no network / tunnel not up yet (Safari says "Load failed")
    app.innerHTML = `<div class="nav">${back('/', 'Notes')}</div><div class="banner err">${offline ? 'Can\u2019t reach the server. Retrying\u2026' : esc(e.message)}</div>`;
    if (offline) { retryTimer = setTimeout(() => render(true), retryDelay); retryDelay = Math.min(retryDelay * 2, 15000); }
  }
  window.scrollTo(0, y);
}
window.onhashchange = () => render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { retryDelay = 2000; render(true); } });  // coming back to the app: refresh in place
window.addEventListener('online', () => { retryDelay = 2000; render(true); });
function applyTheme(t) {
  t = t === 'pink' ? 'pink' : '';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
  const c = t === 'pink' ? ['#fbeef3', '#140a0f'] : ['#f2f2f7', '#000000'];
  document.querySelectorAll('meta[name="theme-color"]').forEach((m, i) => m.content = c[i]);
}
// ---------- pinned player (lives outside #app so chat polling never destroys it) ----------
const player = window.player = {
  note: null, segs: [], title: '', el: $('#player'), audio: $('#paudio'),
  async open(note, t, title) {
    if (this.note !== note) {
      state.notes = state.notes || {}; const n = state.notes[note] || (state.notes[note] = await api('/notes/' + note));
      this.segs = n.segments || []; this.title = n.title || title; this.note = note; this.audio.src = `/api/notes/${note}/audio`; $('#prange').max = n.duration || 0;
    }
    this.el.hidden = false;
    const go = () => { this.audio.currentTime = t; this.audio.play().catch(() => {}); this.tick(); };
    if (this.audio.readyState >= 1) go(); else this.audio.addEventListener('loadedmetadata', go, {once: true});
  },
  close() { if (this.el.hidden) return; this.audio.pause(); this.el.hidden = true; this.note = null; this.audio.removeAttribute('src'); this.audio.load(); app.querySelectorAll('.src.playing').forEach(e => e.classList.remove('playing')); },
  idx() { const t = this.audio.currentTime; let i = -1; for (let k = 0; k < this.segs.length; k++) { if (this.segs[k].start <= t + 0.01) i = k; else break; } return i; },
  step(d) { if (!this.segs.length) return; const i = Math.min(this.segs.length - 1, Math.max(0, this.idx() + d)); this.audio.currentTime = this.segs[i].start; this.audio.play().catch(() => {}); this.tick(); },
  tick() {
    if (this.el.hidden || !this.note) return;
    const i = this.idx(), s = this.segs[i], n = state.notes[this.note], t = this.audio.currentTime;
    $('#pwho').innerHTML = (s ? `${chip(spkName(n, s.speaker))}${voice(spkName(n, s.speaker))} · ` : '') + ts(t);
    $('#ptitle').textContent = this.title + ' ›'; $('#ptitle').href = `#/note/${this.note}?t=${Math.floor(t)}`;
    $('#psub').textContent = s ? (s.hinglish || s.text) : ''; $('#psuben').textContent = s && s.english && s.english !== (s.hinglish || s.text) ? s.english : '';
    $('#prange').value = t; $('#ptime').textContent = ts(t); $('#pplay').textContent = this.audio.paused ? '▶' : '❚❚';
    app.querySelectorAll('.src').forEach(e => { const on = e.dataset.note === this.note && +e.dataset.turn === i && !this.audio.paused; e.classList.toggle('playing', on); const b = e.querySelector('.play'); if (b) b.innerHTML = on ? bars : '▶'; });
  },
};
player.audio.ontimeupdate = player.audio.onpause = player.audio.onplay = () => player.tick();
$('#pplay').onclick = () => player.audio.paused ? player.audio.play().catch(() => {}) : player.audio.pause();
$('#pclose').onclick = () => player.close();
document.querySelectorAll('#player [data-step]').forEach(b => b.onclick = () => player.step(+b.dataset.step));
$('#prange').oninput = e => { player.audio.currentTime = +e.target.value; player.tick(); };
try { state.palette = JSON.parse(localStorage.getItem('palette') || 'null') || undefined; } catch (e) {}
const loadPalette = () => api('/notes').then(ns => { const was = JSON.stringify(state.palette || null);  // names in order of first appearance, oldest note first, so a person's colour never changes
  const seen = []; for (const n of [...ns].reverse()) for (const who of n.speakers || []) if (!/^Speaker \d+$/.test(who) && !seen.includes(who)) seen.push(who);
  state.palette = seen; try { localStorage.setItem('palette', JSON.stringify(seen)); } catch (e) {}
  if (was !== JSON.stringify(state.palette) && document.querySelector('.voice')) render(true); }).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
const shared = new URLSearchParams(location.search).get('shared');
if (shared) { history.replaceState(null, '', location.pathname + location.hash); setTimeout(() => ui.toast(shared === 'dup' ? 'Already transcribed — opening it' : shared === 'ok' ? 'Shared file queued' : shared + ' files queued'), 300); }
render().then(() => { api('/settings').then(s => applyTheme(s.theme)).catch(() => {}); loadPalette(); });  // after the first paint, so the stale-response guard leaves them alone
</script>
</body>
